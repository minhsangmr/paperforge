[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "paperforge"
version = "0.7.0"
description = "A container-first agentic RAG system for academic papers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paperforge contributors" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langfuse>=4,<5",
  "opensearch-py>=2.8,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ui = [
  "gradio>=5.35,<6",
]
ingestion = [
  "docling>=2.96,<3",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[project.scripts]
paperforge = "paperforge.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paperforge*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not component and not external and not docling'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "component: requires Docker Compose infrastructure",
  "external: calls a real external service",
  "docling: requires the ingestion extra and local Docling models",
]

[tool.coverage.run]
branch = true
source = ["paperforge"]
omit = [
  "src/paperforge/cli.py",
  "src/paperforge/infrastructure/bootstrap.py",
  "src/paperforge/gradio_app.py",
  "src/paperforge/services/observability/langfuse.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "migrations"]
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["paperforge"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["docling.*", "gradio.*", "langfuse.*", "opensearchpy.*", "redis.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

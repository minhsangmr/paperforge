name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Container quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare local environment file
        run: cp .env.example .env

      - name: Build Linux development image
        run: docker compose build api

      - name: Sync locked dependencies inside Linux
        run: docker compose run --rm --no-deps api uv sync --frozen

      - name: Check formatting
        run: docker compose run --rm --no-deps api uv run ruff format --check src tests

      - name: Lint
        run: docker compose run --rm --no-deps api uv run ruff check src tests

      - name: Type-check
        run: docker compose run --rm --no-deps api uv run mypy src tests

      - name: Test with coverage
        run: docker compose run --rm --no-deps api uv run pytest --cov=paperforge --cov-report=term-missing

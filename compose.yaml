name: paperforge

x-app-base: &app-base
  build:
    context: .
    target: dev
    args:
      PYTHON_VERSION: "3.12"
      UV_VERSION: "0.10.0"
  init: true
  env_file:
    - .env
  environment:
    PAPERFORGE_HOST: 0.0.0.0
    PAPERFORGE_PORT: 8000
  volumes:
    - .:/workspace
    - paperforge_venv:/workspace/.venv
    - paperforge_uv_cache:/root/.cache/uv

services:
  workspace:
    <<: *app-base
    command: ["sleep", "infinity"]

  api:
    <<: *app-base
    command:
      - uv
      - run
      - uvicorn
      - paperforge.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-access-log
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ingestion:
    build:
      context: .
      target: ingestion-dev
      args:
        PYTHON_VERSION: "3.12"
        UV_VERSION: "0.10.0"
    profiles: ["ingestion"]
    init: true
    env_file:
      - .env
    volumes:
      - .:/workspace
      - paperforge_ingestion_venv:/workspace/.venv
      - paperforge_uv_cache:/root/.cache/uv
      - paperforge_model_cache:/workspace/.cache/models
      - paperforge_pdf_cache:/workspace/data/arxiv_pdfs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:16-bookworm
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperforge}
      POSTGRES_USER: ${POSTGRES_USER:-paperforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperforge-local-only}
    ports:
      - "5432:5432"
    volumes:
      - paperforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-bookworm
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - paperforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - paperforge_opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    profiles: ["search-ui"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

  airflow-db-init:
    profiles:
      - ingestion
    image: postgres:16-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: paperforge
      PGPASSWORD: paperforge-local-only
      AIRFLOW_DB: paperforge_airflow
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |
        if ! psql \
          -d postgres \
          -Atqc "SELECT 1 FROM pg_database WHERE datname='$${AIRFLOW_DB}'" \
          | grep -q '^1$'; then
          createdb "$${AIRFLOW_DB}"
        fi

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_VERSION: "3.3.0"
        PYTHON_VERSION: "3.12"
        UV_VERSION: "0.10.0"
    profiles: ["ingestion"]
    init: true
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-paperforge}:${POSTGRES_PASSWORD:-paperforge-local-only}@postgres:5432/${AIRFLOW_DB:-paperforge_airflow}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      PAPERFORGE_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-paperforge}:${POSTGRES_PASSWORD:-paperforge-local-only}@postgres:5432/${POSTGRES_DB:-paperforge}
      PAPERFORGE_ARXIV__PDF_CACHE_DIR: /workspace/data/arxiv_pdfs
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - paperforge_airflow_logs:/opt/airflow/logs
      - paperforge_model_cache:/workspace/.cache/models
      - paperforge_pdf_cache:/workspace/data/arxiv_pdfs
    ports:
      - "8080:8080"
    command: ["airflow", "standalone"]

volumes:
  paperforge_venv:
  paperforge_ingestion_venv:
  paperforge_uv_cache:
  paperforge_model_cache:
  paperforge_pdf_cache:
  paperforge_postgres:
  paperforge_redis:
  paperforge_opensearch:
  paperforge_airflow_logs:
